<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGON TV</title>
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<header>
  <div class="top">
    <div class="logo">ARGON<span> TV</span></div>
    <nav id="tabs"></nav>
    <input id="q" type="search" placeholder="🔍 Buscar canal" autocomplete="off" spellcheck="false">
  </div>
  <div id="status">Cargando canales...</div>
</header>
<main id="grid"></main>

<div id="player" hidden>
  <video id="video" autoplay playsinline></video>
  <div id="overlay">
    <div id="pname"></div>
    <div id="pmsg"></div>
    <div id="pbtns">
      <button data-act="prev">◀ Anterior</button>
      <button data-act="next">Siguiente ▶</button>
      <button data-act="fav" id="bfav">★ Favorito</button>
      <button data-act="full" id="bfull">⛶ Pantalla completa</button>
      <button data-act="back">✕ Volver</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="m3u.js?v=13"></script>
<script src="app.js?v=13"></script>
</body>
</html>
